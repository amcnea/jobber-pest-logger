name: Functions

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: functions-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  functions:
    name: Functions (typecheck + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: tsc --noEmit
        run: npx tsc --noEmit -p .

      - name: npm test (build + node --test)
        run: npm test
