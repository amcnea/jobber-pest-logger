# Local-only Vite dev server (Firebase unset). Not a production host.
# Shared-shop mode: see the README. Do not uncomment env_file until you want it.
services:
  app:
    build: .
    ports:
      - "5173:5173"
    volumes:
      # Source bind-mount so edits reload like `npm run dev`.
      - .:/app
      # Keep the image's npm ci install; the host node_modules symlink is not for this container.
      - app_node_modules:/app/node_modules
    environment:
      # Bind-mount watching on Docker. Not a Firebase variable.
      CHOKIDAR_USEPOLLING: "true"
    # Firebase stays unset. Do not add VITE_FIREBASE_* or VITE_SHOP_PIN_FUNCTIONS here.
    # For shared-shop mode, uncomment and point at a gitignored file that uses
    # the same names as .env.example (copy that file; do not commit secrets):
    # env_file:
    #   - .env.local
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "5173"]

volumes:
  app_node_modules:
