rules:
  - id: no-eval-or-function-constructor
    languages: [typescript, javascript]
    severity: ERROR
    message: Avoid eval() and new Function(). They execute untrusted strings.
    pattern-either:
      - pattern: eval(...)
      - pattern: new Function(...)
    paths:
      include:
        - src/**

  - id: no-document-write
    languages: [typescript, javascript]
    severity: WARNING
    message: document.write can clobber the page and is an XSS sink. Use DOM APIs instead.
    pattern: document.write(...)
    paths:
      include:
        - src/**

  - id: no-dangerously-set-inner-html
    languages: [typescript, javascript]
    severity: WARNING
    message: dangerouslySetInnerHTML is an XSS sink. Prefer text children unless the HTML is sanitized.
    pattern: dangerouslySetInnerHTML={...}
    paths:
      include:
        - src/**

  - id: no-inner-html-assignment
    languages: [typescript, javascript]
    severity: WARNING
    message: Assigning to innerHTML is an XSS sink.
    pattern: $EL.innerHTML = $HTML
    paths:
      include:
        - src/**

  - id: no-private-key-in-source
    languages: [typescript, javascript]
    severity: ERROR
    message: Private key material in source. Client Firebase apiKey is fine; service-account keys are not.
    pattern-regex: "-----BEGIN ([A-Z0-9]+ )?PRIVATE KEY-----"
    paths:
      include:
        - src/**
        - "*.ts"
        - "*.js"
        - "*.json"

  - id: no-pin-password-in-logs
    languages: [typescript, javascript]
    severity: WARNING
    message: Avoid logging PIN, password, or token values.
    # Regression cases (must match): pin, officePin, officePIN, pinCode, PINCode,
    #   password, passwordHash, password_hash, secret, secretKey, secret_key,
    #   token, token_value, accessToken, authToken, idToken.
    # Must not match: retyping, tokenizer (mid-word).
    pattern-either:
      - pattern: console.$METHOD($MSG)
      - pattern: console.$METHOD($MSG, ...)
    metavariable-regex:
      metavariable: $MSG
      regex: .*(?:(?i:\bpin\b|pin_|_pin|\bpassword\b|password_|passwd|\bsecret\b|secret_|\btoken\b|token_|idToken|sessionToken|refreshToken|accessToken|authToken)|pin[A-Z][A-Za-z0-9]*|[a-z0-9]Pin\b|[a-z0-9]PIN\b|PIN[A-Z][A-Za-z0-9]*|password[A-Z][A-Za-z0-9]*|[a-z0-9]Password\b|secret[A-Z][A-Za-z0-9]*|[a-z0-9]Secret\b|token[A-Z][A-Za-z0-9]*|[a-z0-9]Token\b).*
    paths:
      include:
        - src/**
